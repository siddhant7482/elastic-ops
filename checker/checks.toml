# Elastic Ops — checker configuration
#
# Edit this file, then restart the container. Everything here is read at startup.
# Types: tcp | http | ping
#
#   interval  seconds between checks          (default from [settings])
#   retries   consecutive failures before it alerts
#   severity  "page" wakes you, "notify" is a message, "quiet" only records

[settings]
db                = "/data/ops.db"
listen_port       = 8080
default_interval  = 60
default_retries   = 3
timeout           = 5

web_dir           = "web"           # the portal's static files
inventory         = "inventory.toml"

# Sessions. cookie_secure must stay false until the portal is behind HTTPS —
# a Secure cookie over plain http is simply never sent, and login silently
# fails with no error anywhere.
session_hours     = 12
cookie_secure     = false

# Shared secret for collector/post_estate.py, sent as the X-Ingest-Token
# header. Generate one with:  python3 -c "import secrets;print(secrets.token_urlsafe(32))"
# Without it, backup and host metrics cannot be posted in.
ingest_token      = ""

# Where state changes are sent. Leave empty to only log.
# The WhatsApp gateway on pepper goes here once we know its API.
webhook_url       = ""
webhook_header    = ""          # e.g. "Authorization: Bearer xyz"

# Dead-man's switch: this checker pings the URL every cycle so an OUTSIDE
# service tells you when the checker itself has died. Without this, nothing
# reports the monitoring going down — which is exactly what happened on 4 Oct.
deadman_url       = ""          # e.g. a healthchecks.io ping URL


# Alerts are suppressed inside these windows. Backups run 02:00–04:00 and the
# guest agents time out, which would otherwise train you to ignore the channel.
[[maintenance]]
name  = "Nightly backup window"
start = "02:00"
end   = "04:15"

[[maintenance]]
name  = "Backup store verify"
days  = ["sun"]
start = "03:00"
end   = "06:00"



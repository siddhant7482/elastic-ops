# ---------------------------------------------------------------- jobs
#
# A job calls  http://<checker>:8080/checkin/<token>  when it finishes.
# If it has not called within grace_hours, it goes down. Silence is the alert.
#
# Add this to the end of each script or cron line:
#   curl -fsS -m 10 http://10.10.1.70:8080/checkin/nightly-backup || true

[[jobs]]
name = "Nightly machine backup"
token = "nightly-backup"
grace_hours = 26
severity = "page"

# One job per hypervisor. Sharing a token would let a single host still
# reporting mask four that had stopped — the exact failure this is here to
# catch. install-collector.sh derives the token from the hostname.
[[jobs]]
name = "Collector — pepper"
token = "collector-pepper"
grace_hours = 26

[[jobs]]
name = "Collector — cinnamon"
token = "collector-cinnamon"
grace_hours = 26

[[jobs]]
name = "Collector — proxmox"
token = "collector-proxmox"
grace_hours = 26

[[jobs]]
name = "Collector — yam"
token = "collector-yam"
grace_hours = 26

[[jobs]]
name = "Collector — networkserver"
token = "collector-networkserver"
grace_hours = 26

[[jobs]]
name = "Backup store verify"
token = "pbs-verify"
grace_hours = 192          # weekly, so 8 days

# Stopped 9 July 2026 when the old BackupServer was decommissioned. Left here
# deliberately, and deliberately red: TradePeg and Fresha were reports nobody
# missed in 105 days, but this was a BACKUP, and nobody notices a missing
# backup until they need it. CFP is covered by the nightly whole-VM job, so
# what was lost is point-in-time SQL restore, not everything.
#
# Two honest endings: rehome the dumps and this goes green, or decide they are
# not wanted and delete this block. Leaving it red is the third option and the
# worst one.
[[jobs]]
name = "SQL dumps (needs rehoming — see checks.toml)"
token = "sql-dumps"
grace_hours = 26
severity = "notify"


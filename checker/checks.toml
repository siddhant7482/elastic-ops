# ---------------------------------------------------------------- jobs
#
# A job calls  http://<checker>:8080/checkin/<token>  when it finishes.
# If it has not called within grace_hours, it goes down. Silence is the alert.
#
# Add this to the end of each script or cron line:
#   curl -fsS -m 10 http://10.10.1.70:8080/checkin/nightly-backup || true

[[jobs]]
name = "Nightly machine backup"
token = "nightly-backup"
grace_hours = 26
severity = "page"

[[jobs]]
name = "Backup log collector"
token = "backup-collector"
grace_hours = 26

[[jobs]]
name = "Backup store verify"
token = "pbs-verify"
grace_hours = 192          # weekly, so 8 days

[[jobs]]
name = "SQL dumps"
token = "sql-dumps"
grace_hours = 26

[[jobs]]

# Elastic Ops — checker configuration
#
# Edit this file, then restart the container. Everything here is read at startup.
# Types: tcp | http | ping
#
#   interval  seconds between checks          (default from [settings])
#   retries   consecutive failures before it alerts
#   severity  "page" wakes you, "notify" is a message, "quiet" only records

[settings]
db                = "/data/ops.db"
listen_port       = 8080
default_interval  = 60
default_retries   = 3
timeout           = 5

web_dir           = "web"           # the portal's static files
inventory         = "inventory.toml"

# Sessions. cookie_secure must stay false until the portal is behind HTTPS —
# a Secure cookie over plain http is simply never sent, and login silently
# fails with no error anywhere.
session_hours     = 12
cookie_secure     = false

# Shared secret for collector/post_estate.py, sent as the X-Ingest-Token
# header. Generate one with:  python3 -c "import secrets;print(secrets.token_urlsafe(32))"
# Without it, backup and host metrics cannot be posted in.
ingest_token      = ""

# WhatsApp. No gateway existed on the estate when this was written, so pick
# one and fill in the four values it needs:
#
#   waha        url = http://host:3000          session, to
#   wppconnect  url = http://host:21465         session, to, token
#   evolution   url = http://host:8080          session, to, token
#   twilio      url = https://api.twilio.com/2010-04-01/Accounts/<SID>/Messages.json
#               token = "<SID>:<auth token>", from = your Twilio number
#   callmebot   to and token only
#
# to = "4477...@c.us" for waha, or "+4477..." for twilio/callmebot.
#
#   python3 app.py checks.toml --whatsapp-test
#
# Read whatsapp.py before choosing. The self-hosted options drive a real
# WhatsApp account over the Web protocol: sessions drop and accounts can be
# banned. And a gateway hosted on pepper dies WITH the portal, so a pepper
# failure would send nothing — which is the 4 October failure rebuilt.
whatsapp_provider = ""          # waha | wppconnect | evolution | twilio | callmebot | generic
whatsapp_url      = ""
whatsapp_session  = "default"
whatsapp_to       = ""
whatsapp_from     = ""          # twilio only
whatsapp_token    = ""          # set via OPS_WHATSAPP_TOKEN

# Alerts into Matrix. The estate already runs Synapse behind
# messenger.elasticgroup.co.uk with an Element client branded "Elastic Group
# Messenger", so alerts land where the team already looks. E2EE is disabled on
# that deployment, so a bot needs only an access token.
#
#   python3 app.py checks.toml --matrix-login    # get the token
#   python3 app.py checks.toml --matrix-rooms    # find the room id
#   python3 app.py checks.toml --matrix-test     # prove it works
#
# The token is a secret: it goes in .env as OPS_MATRIX_TOKEN, never here.
matrix_homeserver = "https://messenger.elasticgroup.co.uk"
matrix_room       = ""          # e.g. "!abcdef:chat.internal"
matrix_token      = ""          # set via OPS_MATRIX_TOKEN

# A generic JSON webhook, if anything else should hear about it too.
# Both can be on at once; leave empty to only log.
webhook_url       = ""
webhook_header    = ""          # e.g. "Authorization: Bearer xyz"

# Dead-man's switch: this checker pings the URL every cycle so an OUTSIDE
# service tells you when the checker itself has died. Without this, nothing
# reports the monitoring going down — which is exactly what happened on 4 Oct.
deadman_url       = ""          # e.g. a healthchecks.io ping URL

# When "notify" alerts may be sent. "page" ignores this and goes at any hour;
# "quiet" is recorded and never sent. Leave notify_hours empty for around the
# clock. Held alerts are still recorded and still appear in the portal — they
# just do not light up a phone at 02:00.
notify_hours      = "08:00-18:00"
notify_days       = ["mon", "tue", "wed", "thu", "fri"]


# Alerts are suppressed inside these windows. Backups run 02:00–04:00 and the
# guest agents time out, which would otherwise train you to ignore the channel.
[[maintenance]]
name  = "Nightly backup window"
start = "02:00"
end   = "04:15"

[[maintenance]]
name  = "Backup store verify"
days  = ["sun"]
start = "03:00"
end   = "06:00"


# ---------------------------------------------------------------- business

# Resolved through SQL Browser rather than a fixed port. It was pinned to
# 63143, which had stopped being true: a named instance gets a dynamic port
# that moves when the service restarts. The single most critical system in
# the estate was showing red for a reason nobody could have acted on.
[[checks]]
name = "CFP / WinMan SQL"
group = "Business"
type = "mssql"
target = '10.10.1.65\CFP'
severity = "page"

[[checks]]
name = "ArrearsMan SQL"
group = "Business"
type = "tcp"
target = "10.10.1.35:1433"
severity = "notify"


# ---------------------------------------------------------------- coverage
#
# Guests that genuinely do not need a check — test clones, shells, things
# kept only so their disk exists. Anything listed here stops appearing under
# "Running, but nobody is watching" on the Services page.
#
# Keep this list honest. Every entry is a decision that nobody will be told
# when that machine stops, and the list is only useful while it is short.
#
# Use the bare VMID, or host/VMID to be specific:
#   unmonitored_ok = ["9910", "pepper/9911"]

unmonitored_ok = []


# ---------------------------------------------------------------- device data
#
# Multifunction printers keep scanned and printed documents on internal
# storage. The portal detects the media over SNMP; whether it is encrypted and
# what happens to it on disposal are human answers, recorded here.
#
# Match on the device address. state: ok | warn | bad

[[device_data]]
address  = "192.168.42.177"
encrypted = "Unknown"
wipe      = "Not documented"
note      = "250 GB HDD. Printed 220k pages; also holds scans and the address book."
state     = "warn"

# Elastic Ops — inventory
#
# The parts of the estate that change a few times a year rather than every
# minute: what the hardware is, what the applications are, who gets told, and
# what breaks when a host dies. Kept here rather than in the database because
# it belongs in version control, and because screens to edit it would be more
# code than the data is worth.
#
# Live numbers (memory in use, pool fullness, backup ages) are NOT here. Those
# are posted in by collector/post_estate.py and stored in the database.
#
# Edit, then restart the container.



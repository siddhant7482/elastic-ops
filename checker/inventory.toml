# ---------------------------------------------------------------- alert routing
#
# Almost nothing deserves to wake you. Keeping "page" to five things is what
# keeps the channel worth reading.

[[routing]]
level = "Page"
state = "bad"
applies = "CFP SQL, cinnamon, proxmox, backup store, nightly backup"
channel = "WhatsApp"
who = "Siddhant"
when = "Any hour"

[[routing]]
level = "Notify"
state = "warn"
applies = "Everything else that goes down"
channel = "WhatsApp"
who = "Siddhant, Esti"
when = "08:00 – 18:00, weekdays"

[[routing]]
level = "Notify"
state = "warn"
applies = "Capacity and certificate warnings"
channel = "Weekly digest"
who = "Siddhant"
when = "Mondays 08:00"

[[routing]]
level = "Quiet"
state = "dim"
applies = "Everything inside a maintenance window"
channel = "Recorded only"
who = "—"
when = "Always"



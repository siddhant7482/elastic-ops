# ---------------------------------------------------------------- what breaks
#
# The question nobody can answer at 3am unless it was written down first.

[[blast]]
host = "cinnamon"
stops = "CFP and WinMan, domain logins, file shares, the backup relay for proxmox"
notices = "Everyone, immediately"
recovery = "Restore to yam — about 3 hours for CFP alone"

[[blast]]
host = "proxmox"
stops = "ArrearsMan and all six WinMan workstations"
notices = "Finance, and anyone using WinMan"
recovery = "Restore to yam — about 2 hours for all seven"

[[blast]]
host = "yam"
stops = "Every backup in the estate, the app fleet, the AWS imports"
notices = "Nobody at first — then everything"
recovery = "No second copy exists anywhere"

[[blast]]
host = "pepper"
stops = "Knowledge base, password manager, messenger gateway, this portal"
notices = "The tech team"
recovery = "Restore from the backup store"

[[blast]]
host = "networkserver"
stops = "CCTV management and all monitoring"
notices = "Security, and every alert stops"
recovery = "Nothing to restore from"



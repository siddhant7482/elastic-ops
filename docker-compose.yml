services:
  ops:
    image: python:3.12-slim
    container_name: elastic-ops
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "app.py", "/app/checks.toml"]
    # Secrets come from .env, which is gitignored. checks.toml holds empty
    # placeholders so the repository never carries a token.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: "${TZ:-Europe/London}"
    volumes:
      # Read-only: the application. Nothing in here is written at runtime.
      - ./checker:/app:ro
      # The database, including accounts and sessions. Back this up.
      - ops-data:/data
    ports:
      - "8080:8080"
    # ICMP from a container needs this; tcp, http and https checks do not.
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  ops-data:
